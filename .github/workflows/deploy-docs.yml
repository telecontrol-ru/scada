name: Deploy docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        # Pinned by commit, not to the @v1 branch, because this is the one
        # third-party action here: its moving ref is rewritable by anyone with
        # push access to it. The cost is the maintainers' own warning -- a pin
        # freezes which Ruby versions the action can install (as of this commit,
        # 2026-07-22) -- so bump it when `ruby-version` below needs a release
        # newer than that. Dependabot is off for this tree, so nothing reminds
        # you: https://github.com/ruby/setup-ruby/releases/tag/v1.321.0
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Validate i18n page mappings
        run: ruby scripts/validate_i18n_pages.rb

      - name: Validate English links
        run: ruby scripts/validate_en_links.rb

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build Jekyll site
        env:
          JEKYLL_ENV: production
          PAGES_REPO_NWO: ${{ github.repository }}
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}" --destination ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
